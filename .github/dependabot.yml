version: 2
# Grouped so one week produces one PR per ecosystem instead of one per module;
# each PR runs two workflows (ci.yml and the release build), so ungrouped
# updates cost hours of CI.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/player"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/tests/web"
    schedule:
      interval: "monthly"
    groups:
      web-tests:
        patterns: ["*"]
  # The Playwright smoke test is the only check that drives the real drop
  # handler and history buttons, so its driver needs the same update and
  # advisory coverage as the jsdom harness. It runs weekly (weekly.yml), not
  # on the PR: run Weekly checks by hand on the update's branch before merging.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "monthly"
    groups:
      e2e-tests:
        patterns: ["*"]
