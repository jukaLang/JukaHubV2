name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default: a job that does not ask for writes cannot use them.
# Only the release job below needs more, and it says so on its own block.
permissions:
  contents: read

jobs:
  # The PS Remote Play helpers for every TrimUI archive's bin/; see
  # remote-play-helpers.yml for how they are built and why they may fail.
  helpers:
    name: Remote Play helpers
    uses: ./.github/workflows/remote-play-helpers.yml
    # What the helpers job asks for: actions read, to reuse helpers an earlier
    # push-to-main run of this workflow built. A tag run never finds any (it
    # is no push to main), so tags always build them; but a called workflow
    # asking for more than its caller grants does not start at all.
    permissions:
      contents: read
      actions: read

  build:
    runs-on: ubuntu-24.04
    needs: helpers
    # Runs whatever became of the helpers: without them release.sh warns and
    # the archives ship without Remote Play streaming, which must not cost the
    # tag its release.
    if: ${{ !cancelled() }}
    # The only job in this workflow that writes: it creates the draft release
    # for the tag, attaches the built archives to it and publishes it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Remote Play helpers
        # Into native/bin, where release.sh looks for them. Absent when their
        # build failed. Bounded, because continue-on-error does not end a step
        # that hangs.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-play-helpers
          path: player/native/bin

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Every other workflow reads the version from player/go.mod; release
          # packaging must not fall behind it.
          go-version: "1.27"
          cache-dependency-path: player/go.sum

      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            gcc-aarch64-linux-gnu \
            zip python3

      - name: Run release packaging
        working-directory: player
        run: bash ./release.sh

      # Upload into a draft so the release stays out of /releases/latest until
      # every asset is attached. A published release with only GitHub's
      # auto-generated "Source code" archives is what made download links 404
      # while the build was still uploading. The next step publishes it.
      # A tag with a prerelease suffix (v1.4.0-beta.1, v1.4.0-rc.2) is the
      # beta channel: it gets its own release for people watching the
      # releases page, but GitHub keeps prereleases out of /releases/latest
      # and the latest/download redirect, which is exactly what the in-app
      # updater (autoupdate.go) and the Patch package manager consume — so
      # stable installs never offer the beta. The repo's GitHub pages stay
      # the only thing beta testers need.
      - name: Upload release assets (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # JukaHub-RemotePlay-linux-arm64.zip is there only when the helpers
          # were built; a pattern that matches nothing is skipped, not an error.
          files: |
            player/dist/JukaHub-trimui-smart-pro-linux-arm64.tar.gz
            player/dist/JukaHub-RemotePlay-linux-arm64.zip
            player/dist/JukaHub-win-x64.zip
            player/dist/manifest.json
            player/dist/SHA256SUMS
          generate_release_notes: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh release edit cannot un-set a draft flag without --draft=false,
          # and the prerelease flag set above survives this edit untouched.
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
