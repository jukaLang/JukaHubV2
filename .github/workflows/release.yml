name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Every other workflow reads the version from player/go.mod; release
          # packaging must not fall behind it.
          go-version: "1.27"
          cache-dependency-path: player/go.sum

      - name: Install SDL2 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            gcc-aarch64-linux-gnu \
            zip python3

      - name: Run release packaging
        working-directory: player
        run: bash ./release.sh

      # Upload into a draft so the release stays out of /releases/latest until
      # every asset is attached. A published release with only GitHub's
      # auto-generated "Source code" archives is what made download links 404
      # while the build was still uploading. The next step publishes it.
      # A tag with a prerelease suffix (v1.4.0-beta.1, v1.4.0-rc.2) is the
      # beta channel: it gets its own release for people watching the
      # releases page, but GitHub keeps prereleases out of /releases/latest
      # and the latest/download redirect, which is exactly what the in-app
      # updater (autoupdate.go) and the Patch package manager consume — so
      # stable installs never offer the beta. The repo's GitHub pages stay
      # the only thing beta testers need.
      - name: Upload release assets (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          files: |
            player/dist/JukaHub-trimui-smart-pro-linux-arm64.tar.gz
            player/dist/JukaHub-win-x64.zip
            player/dist/manifest.json
            player/dist/SHA256SUMS
          generate_release_notes: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh release edit cannot un-set a draft flag without --draft=false,
          # and the prerelease flag set above survives this edit untouched.
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
