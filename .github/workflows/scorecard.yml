# OpenSSF Scorecard — automated, public, third-party check of supply-chain
# hygiene (pinned actions, branch protection, token permissions, etc.).
# Results publish to the security tab and feed api.scorecard.dev, where the
# README badge reads from. Results are advisory: they are evidence of where
# hardening is missing, never a merge gate for contributors.
name: OpenSSF Scorecard

on:
  # Weekly, plus a run whenever protection rules change so a weakening shows up
  # immediately instead of up to seven days later.
  branch_protection_rule:
  schedule:
    - cron: "35 4 * * 6"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # publish results to the Security tab
      id-token: write          # publish_results uses keyless Sigstore signing
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Analyze with Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Publish to the security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
