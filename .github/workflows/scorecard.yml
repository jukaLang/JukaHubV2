# OpenSSF Scorecard — automated, public, third-party check of supply-chain
# hygiene (pinned actions, branch protection, token permissions, etc.).
# Results publish to the security tab and feed api.scorecard.dev, where the
# README badge reads from. Results are advisory: they are evidence of where
# hardening is missing, never a merge gate for contributors.
name: OpenSSF Scorecard

on:
  # Weekly, plus a run whenever protection rules change so a weakening shows up
  # immediately instead of up to seven days later. Not on every push as well:
  # the badge shows the latest result, and a week is soon enough for the
  # workflow changes it scores.
  branch_protection_rule:
  schedule:
    - cron: "35 4 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write   # publish results to the Security tab
      id-token: write          # publish_results uses keyless Sigstore signing
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze with Scorecard
        uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Publish to the security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
