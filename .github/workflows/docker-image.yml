name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only by default: every job that publishes something asks for the
# contents write it needs on its own block, so a job added later starts with a
# token that cannot change the repository.
permissions:
  contents: read

jobs:
  create-tag:
    name: Create Tag and Draft Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the tag and the draft release
    outputs:
      tag_name: ${{ steps.generate_tag.outputs.tag_name }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Tag Name
        id: generate_tag
        run: |
          timestamp=$(date +%Y%m%d%H%M%S)
          tag=JukaHub-$timestamp
          echo "tag_name=$tag" >> $GITHUB_OUTPUT

      - name: Set Tag using GitHub Script
        id: set_tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ steps.generate_tag.outputs.tag_name }}`,
              sha: context.sha,
            })

      # The release starts as a draft on purpose. GitHub publishes a release
      # the moment it is created, and the two builds below take many minutes,
      # so a published release showed only "Source code (zip)" while every
      # download link (README, website, in-app updater) pointed at an archive
      # that did not exist yet and answered 404. A draft keeps the tag and the
      # upload target, stays out of /releases/latest, and only becomes public
      # once publish-release has verified both archives are attached.
      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          release_name: ${{ steps.generate_tag.outputs.tag_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The PS Remote Play helpers (Apps/JukaHub/bin/chiaki-stream and
  # chiaki-regist) and AndroidRT (Apps/JukaHub/androidrt), built natively on an
  # arm64 runner; why there, and why a failure is allowed, is in
  # remote-play-helpers.yml. It starts at once, beside create-tag.
  build-remote-play-helpers:
    name: Remote Play helpers and AndroidRT
    uses: ./.github/workflows/remote-play-helpers.yml
    # The helpers job asks for exactly these: actions read is how it finds the
    # helpers and AndroidRT an earlier release run built from the same sources.
    # A called workflow cannot be given more than its caller grants, and asking
    # for more fails the whole run before it starts.
    permissions:
      contents: read
      actions: read

  # The Box64 pack of the Windows-app runtime (JukaHub-Wine-linux-arm64.zip),
  # on an arm64 runner of its own, also from the start. It is in neither app
  # archive, so nothing on the way to the release waits for it:
  # attach-wine-runtime below puts it on the release whenever it is ready. (In
  # the helpers' job it held up JukaHub-Trimui.zip by the ten minutes a Box64
  # build takes.)
  build-wine-runtime:
    name: Windows-app runtime (Box64)
    uses: ./.github/workflows/wine-runtime.yml
    # What its job asks for, as above.
    permissions:
      contents: read
      actions: read

  # The handheld binary (linux/arm64, cgo + SDL2), compiled in the community
  # TrimUI toolchain image, which carries what a binary must be linked against
  # to start on the handheld: the device SDK sysroot, the Linaro aarch64 gcc and
  # SDL2 2.26.1. The image runs under docker run, started by
  # .github/scripts/trimui-build.sh with no network and the checkout, the
  # runner's Go and both Go caches mounted at their own paths, rather than as
  # the job's container: that way the job can carry the Go build cache from one
  # release to the next as the Windows job does (go-build-cache.sh needs gh and
  # zstd, which the image lacks), and the image download overlaps the module
  # and cache downloads. It needs nothing from the other jobs, so it starts at
  # once; the packaging job below waits for it, the tag and the helpers.
  #
  # The job this replaces also built zlib, libpng, libjpeg, bzip2, libtiff and
  # libwebp from source on every release. They were for a fully static link
  # given up long ago (commit edb40d4, "dynamic test"); the dynamic link never
  # used them, as build-sdcard.yml's build without them showed.
  build-trimui:
    name: Build for TrimUI (linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read     # find and download the previous release's build cache
    env:
      # Pinned by digest: the image has one tag (latest), last pushed long ago, and a
      # silent re-push would change every build. Dependabot does not bump this.
      TOOLCHAIN_IMAGE: anibaldeboni/trimui-smart-pro-toolchain:latest@sha256:69c8c0cd1a0330f21d3e6d82885e67d01bd895dc007ec5d121bca8d857997c42
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The toolchain image runs with the checkout mounted; nothing here
          # pushes, so no token stays in .git/config for it to read.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: player/go.mod
          # Not setup-go's cache, for the reason the Windows job gives: what is
          # restored here flows into the published binary.
          cache: false

      - name: Pull the toolchain image, the Go modules and the build cache
        # The three download side by side; none needs another, and the step
        # waits for all of them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/fetch-logs"
          mkdir -p "$logs"
          : > "$logs/image.log"
          : > "$logs/go.log"
          show_logs() {
            echo "::group::Toolchain image"; cat "$logs/image.log"; echo "::endgroup::"
            echo "::group::Go toolchain, modules and build cache"; cat "$logs/go.log"; echo "::endgroup::"
          }
          trap 'status=$?; [ "$status" -eq 0 ] || show_logs' EXIT
          echo "### TrimUI build" >> "$GITHUB_STEP_SUMMARY"

          # Named after the image digest: cgo compiles against the image's
          # sysroot and SDL headers, which Go's cache keys cannot see, so a new
          # image starts a new cache instead of reusing objects built against
          # the old one.
          digest=${TOOLCHAIN_IMAGE##*@sha256:}
          artifact="go-build-cache-trimui-${digest:0:12}"
          echo "GO_CACHE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

          # A registry hiccup should cost seconds, not the release.
          (
            for try in 1 2 3; do
              if docker pull -q "$TOOLCHAIN_IMAGE"; then exit 0; fi
              echo "pull attempt $try failed"
              [ "$try" -eq 3 ] || sleep $((try * 15))
            done
            exit 1
          ) > "$logs/image.log" 2>&1 &
          image_job=$!

          # Bounded like the Windows job's restore: a stalled download must
          # cost a cold build, not the job's timeout and with it the release.
          (
            cd player
            go version
            go mod download
            timeout 300 bash "$GITHUB_WORKSPACE/.github/scripts/go-build-cache.sh" restore "$artifact" ||
              echo "::warning title=Go build cache::the restore failed or ran out of time; building without it"
          ) > "$logs/go.log" 2>&1 &
          go_job=$!

          if ! wait "$image_job"; then
            echo "::error::the TrimUI toolchain image did not download (see the Toolchain image group)"
            exit 1
          fi
          if ! wait "$go_job"; then
            echo "::error::fetching the Go toolchain or the modules failed (see the Go group)"
            exit 1
          fi
          show_logs

      - name: Build Package
        run: |
          set -o pipefail
          start=$SECONDS
          build() {
            bash .github/scripts/trimui-build.sh go JukaHub-Trimui "$RUNNER_TEMP/go-build.log"
          }
          if ! build; then
            # As in the Windows job: a restored cache that cannot build must
            # not fail every release after it. Retry once from an empty cache,
            # which also makes the cache step upload a fresh one; discard
            # refuses when nothing was restored, as a cold retry would only
            # repeat the failure.
            bash .github/scripts/go-build-cache.sh discard
            echo "::warning title=Go build cache::the build failed on the restored cache; retrying from an empty one"
            build
          fi
          echo "Build completed in $((SECONDS - start)) s."
          echo "- go build: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the spatial audio plugin
        # Spatial audio in RetroArch games (player/spatialfx): a small C library
        # RetroArch loads as an audio DSP filter. Built with the player's own
        # cross compiler and sysroot, so it loads on the handheld's glibc, into
        # lib/ where spatial_games.go looks for it. Optional: a failed build
        # ships the archive without it, and the Audio panel then says the game
        # plugin is not installed.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # A failed build leaves no library; drop the then-empty lib/ too.
          bash .github/scripts/trimui-build.sh spatial JukaHub-Trimui || {
            rmdir "$PWD/JukaHub-Trimui/lib" 2>/dev/null || true
            exit 1
          }

      - name: Check the binary can start on the handhelds
        # An AArch64 program for the standard glibc loader that links the
        # firmware's SDL2 and needs no glibc newer than the firmware's: a wrong
        # compiler or sysroot stops the release here, not on a handheld.
        run: bash .github/scripts/trimui-build.sh check JukaHub-Trimui/JukaHub

      - name: Hand the build to the packaging job
        # A tar keeps the binary's exec bit, which an artifact alone loses.
        run: tar -C JukaHub-Trimui -cf "$RUNNER_TEMP/trimui-build.tar" .

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trimui-build
          path: ${{ runner.temp }}/trimui-build.tar
          # Long enough to re-run only a failed packaging job a few days on;
          # after that "Re-run all jobs" makes a new tag and draft anyway.
          retention-days: 3
          if-no-files-found: error
          # A re-run of this job replaces its own earlier upload.
          overwrite: true

      # As in the Windows job: only for a push to main (restore accepts a cache
      # from no other event), after the build is handed on, and bounded twice
      # over, since the cache only speeds up the next release.
      - name: Pack the build cache for the next release
        id: cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          own=$(cd player && go list -m)
          bash .github/scripts/go-build-cache.sh save "$GO_CACHE_ARTIFACT" "$RUNNER_TEMP/go-build-cache" "$RUNNER_TEMP/go-build.log" "$own"

      - name: Upload the build cache
        if: steps.cache.outputs.upload == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.GO_CACHE_ARTIFACT }}
          path: ${{ steps.cache.outputs.archive }}
          # Already zstd-compressed: zipping it again would only cost time.
          compression-level: 0
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  # Packaging only: the binary and the game-audio plugin come from build-trimui,
  # the Remote Play helpers and AndroidRT from their own job. Waiting for those
  # here, rather than making the compile wait for the helpers, lets both build
  # at once.
  build-and-publish-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [create-tag, build-remote-play-helpers, build-trimui]
    # Runs whatever became of the helpers: an archive without them still ships
    # (it only lacks Remote Play streaming, like every release before them), so
    # their job must not be able to skip this one. A cancelled run still stops.
    if: ${{ !cancelled() && needs.create-tag.result == 'success' && needs.build-trimui.result == 'success' }}
    permissions:
      contents: write   # attach the handheld archive to the draft
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
      UPLOAD_URL: ${{ needs.create-tag.outputs.upload_url }}
    steps:
      - name: Debug TAG_NAME
        run: |
          echo "Debug TAG_NAME: ${TAG_NAME}"
      - name: Check Tag Name Variable
        run: |
          if [ -z "${TAG_NAME}" ]; then
            echo "TAG_NAME variable does not exist. Exiting."
            exit 1
          else
            echo "TAG_NAME variable exists: ${TAG_NAME}"
          fi
    
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the TrimUI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trimui-build
          path: ${{ runner.temp }}/trimui-build

      - name: Unpack the TrimUI build
        # JukaHub, and lib/ when the game-audio plugin built, with their modes.
        run: |
          mkdir -p JukaHub-Trimui
          tar -xf "$RUNNER_TEMP/trimui-build/trimui-build.tar" -C JukaHub-Trimui
          ls -la JukaHub-Trimui

      - name: Download the Remote Play helpers
        # Absent when their build failed; Package Artifacts then warns and the
        # archive goes out without bin/, as every release before them did.
        # Bounded: continue-on-error does not end a step that hangs, so a
        # stalled download would otherwise run into the job's own timeout and
        # cost the release its handheld archive.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-play-helpers
          path: remote-play-helpers

      - name: Download AndroidRT
        # JukaHub-AndroidRT-linux-arm64.zip from the helper job; absent when its
        # build failed, and then the archive ships without androidrt/. Bounded
        # like the download above.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: androidrt-package
          path: runtime-packages

      - name: Download offline speech recognition
        continue-on-error: true
        timeout-minutes: 8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-stt
          path: offline-stt

      - name: Package Artifacts
        id: package
        run: |
          mkdir -p JukaHub-Trimui
          # The PS Remote Play client runs these two from Apps/JukaHub/bin.
          # Artifacts do not keep file modes, so they are made executable here,
          # and zip stores that mode for whatever unpacks the archive.
          if [ -f remote-play-helpers/chiaki-stream ] && [ -f remote-play-helpers/chiaki-regist ]; then
            mkdir -p JukaHub-Trimui/bin
            cp remote-play-helpers/chiaki-stream remote-play-helpers/chiaki-regist JukaHub-Trimui/bin/
            chmod 755 JukaHub-Trimui/bin/chiaki-stream JukaHub-Trimui/bin/chiaki-regist
            echo "Remote Play helpers added to bin/:"
            sed -n '1,4p' remote-play-helpers/BUILDINFO.txt 2>/dev/null || true
            # The same helpers on their own, as JukaHub-RemotePlay-linux-arm64.zip:
            # a handheld whose JukaHub has no bin/ (installed from an older or
            # partial package) downloads this one by itself when PS Remote Play
            # opens (player/psremote_helpers_install.go), instead of the user
            # fetching files. SHA256SUMS lets it check what it unpacked.
            # Optional like the helpers themselves: a failure here leaves the
            # release without the package, never without JukaHub-Trimui.zip.
            rm -rf remote-play-package JukaHub-RemotePlay-linux-arm64.zip
            if (
              mkdir -p remote-play-package/bin &&
              cp JukaHub-Trimui/bin/chiaki-stream JukaHub-Trimui/bin/chiaki-regist remote-play-package/bin/ &&
              { [ ! -f remote-play-helpers/BUILDINFO.txt ] || cp remote-play-helpers/BUILDINFO.txt remote-play-package/bin/; } &&
              cd remote-play-package && sha256sum bin/* > SHA256SUMS &&
              zip -r ../JukaHub-RemotePlay-linux-arm64.zip bin SHA256SUMS
            ); then
              echo "helpers_package=true" >> "$GITHUB_OUTPUT"
            else
              rm -f JukaHub-RemotePlay-linux-arm64.zip
              echo "::warning title=Remote Play helpers::the helper package could not be built; this release goes out without JukaHub-RemotePlay-linux-arm64.zip"
            fi
          else
            echo "::warning title=Remote Play helpers::not built for this run; JukaHub-Trimui.zip ships without Remote Play streaming (see the Remote Play helpers job)"
          fi
          # AndroidRT, the Android-app runtime: androidrt/ beside the binary
          # (Apps/JukaHub/androidrt on the handheld), and the same folder alone
          # as JukaHub-AndroidRT-linux-arm64.zip for a JukaHub installed from a
          # package without it. build-runtimes.sh checks the package first (one
          # folder, every file in its SHA256SUMS and matching). Optional like
          # the helpers: a failure here costs the archive its androidrt/ and
          # the release that zip, never JukaHub-Trimui.zip.
          rm -rf JukaHub-Trimui/androidrt JukaHub-AndroidRT-linux-arm64.zip
          if [ -f runtime-packages/JukaHub-AndroidRT-linux-arm64.zip ]; then
            if sh player/native/build-runtimes.sh unpack runtime-packages/JukaHub-AndroidRT-linux-arm64.zip JukaHub-Trimui/androidrt &&
              cp runtime-packages/JukaHub-AndroidRT-linux-arm64.zip .; then
              echo "androidrt_package=true" >> "$GITHUB_OUTPUT"
              sed -n '1,4p' JukaHub-Trimui/androidrt/BUILDINFO.txt 2>/dev/null || true
            else
              rm -rf JukaHub-Trimui/androidrt JukaHub-AndroidRT-linux-arm64.zip
              echo "::warning title=AndroidRT::the AndroidRT package did not verify; JukaHub-Trimui.zip ships without androidrt/ and the release without JukaHub-AndroidRT-linux-arm64.zip"
            fi
          else
            echo "::warning title=AndroidRT::not built for this run; JukaHub-Trimui.zip ships without androidrt/ (see the Remote Play helpers and AndroidRT job)"
          fi
          if [ -f offline-stt/whisper-cli ] && [ -f offline-stt/ggml-tiny.bin ] && \
             printf '%s  %s\n' be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 offline-stt/ggml-tiny.bin | sha256sum -c - > /dev/null; then
            mkdir -p JukaHub-Trimui/required/juka-whisper
            cp offline-stt/whisper-cli offline-stt/ggml-tiny.bin JukaHub-Trimui/required/juka-whisper/
            chmod 755 JukaHub-Trimui/required/juka-whisper/whisper-cli
          else
            echo "::warning title=Offline speech::the verified recognizer was not built; local speech is unavailable in this archive"
          fi
          cp player/jukaconfig.json JukaHub-Trimui/
          cp player/Inter-Regular.ttf JukaHub-Trimui/
          cp player/launch.sh JukaHub-Trimui/
          cp player/config.json JukaHub-Trimui/
          cp player/background.jpg JukaHub-Trimui/
          cp player/JukaPlayer.png JukaHub-Trimui/
          # Tools -> Security & trust opens SECURITY.md from next to the binary.
          if [ -f SECURITY.md ]; then
            cp SECURITY.md JukaHub-Trimui/
          fi
          # Release stamp: the app shows this date and the auto updater uses it
          # to decide whether a newer release exists.
          printf '{\n  "tag": "%s",\n  "date": "%s"\n}\n' "$TAG_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > JukaHub-Trimui/release-info.json
          zip -r JukaHub-Trimui.zip JukaHub-Trimui/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-Trimui.zip
          asset_name: JukaHub-Trimui.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the Remote Play helper package
        # Optional, like the helpers themselves: publish-release waits only for
        # the two app archives, and a JukaHub that finds no helper package on
        # the newest release takes it from the newest release that has one.
        # Bounded, because continue-on-error does not end a step that hangs.
        if: steps.package.outputs.helpers_package == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-RemotePlay-linux-arm64.zip
          asset_name: JukaHub-RemotePlay-linux-arm64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the AndroidRT package
        # Optional in the same way: a JukaHub that finds none on the newest
        # release takes it from the newest release that has one (relpack.go).
        if: steps.package.outputs.androidrt_package == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-AndroidRT-linux-arm64.zip
          asset_name: JukaHub-AndroidRT-linux-arm64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Box64 pack of the Windows-app runtime: only a release asset, which
  # JukaHub installs when Windows apps are first set up (or the emulator update
  # pass brings a newer one). Attached as soon as wine-runtime.yml has it,
  # before or after publish-release, which does not wait for it: JukaHub takes
  # the pack from the newest release that carries one, so a release that gets
  # it a few minutes after it went public costs nothing. (With immutable
  # releases turned on for the repository, a release that went public first
  # can no longer take the pack: the upload then warns, and JukaHub keeps
  # installing it from an older release until a later one carries it.) A
  # separate job rather than a step of that workflow, so the job that runs
  # Box64's third-party build as root never holds a token that can write to
  # the repository.
  attach-wine-runtime:
    name: Attach the Box64 pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [create-tag, build-wine-runtime]
    # Whatever became of the build: without a pack this only warns.
    if: ${{ !cancelled() && needs.create-tag.result == 'success' }}
    permissions:
      contents: write   # attach the pack to the release
    steps:
      - name: Check out build-runtimes.sh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the script that checks the pack; nothing here pushes.
          sparse-checkout: player/native/build-runtimes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the Box64 pack
        # Absent when its build failed. Bounded, because continue-on-error
        # does not end a step that hangs.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wine-runtime-package
          path: runtime-packages

      - name: Check the Box64 pack
        id: pack
        # One wine-runtime/ folder, every file in its SHA256SUMS and matching:
        # what JukaHub checks before it installs the pack.
        run: |
          zip=runtime-packages/JukaHub-Wine-linux-arm64.zip
          if [ ! -f "$zip" ]; then
            echo "::warning title=Box64::not built for this run; this release goes out without JukaHub-Wine-linux-arm64.zip (see the Windows-app runtime job)"
          elif sh player/native/build-runtimes.sh verify "$zip"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Box64::the Box64 pack did not verify; this release goes out without JukaHub-Wine-linux-arm64.zip"
          fi

      - name: Upload the Box64 pack
        # Optional like the other runtime packages: without it JukaHub installs
        # the pack from an older release that has one, so a failure only warns.
        # --clobber: a re-run replaces the pack an earlier attempt attached,
        # which keeps the release's pack the one later runs reuse.
        if: steps.pack.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
        run: |
          if ! gh release upload "$TAG_NAME" runtime-packages/JukaHub-Wine-linux-arm64.zip \
              --clobber --repo "$GITHUB_REPOSITORY" 2> "$RUNNER_TEMP/upload.err"; then
            cat "$RUNNER_TEMP/upload.err"
            echo "::warning title=Box64::could not attach JukaHub-Wine-linux-arm64.zip to $TAG_NAME ($(head -n 1 "$RUNNER_TEMP/upload.err")); JukaHub installs the pack from an older release. With immutable releases on, a release published before the pack was ready cannot take it."
          fi

  # Cross-compiled on Ubuntu with the distribution's MinGW-w64. This job used
  # to cross-compile the same way on macos-latest with Homebrew's MinGW, but
  # macOS runners are the scarcest hosted machines: a release sat on "Waiting
  # for a runner to pick up this job" long after both Ubuntu jobs had finished,
  # and publish-release waits for this job. An Ubuntu runner starts at once,
  # needs no Homebrew, and the archive keeps the same files.
  #
  # Most of a cold run is compiling the Go standard library, every module and
  # the cgo-heavy SDL bindings for windows/amd64, so the job starts from the Go
  # build cache the previous release left behind and only the player itself
  # compiles. Where that cache may come from, and why it is not actions/cache,
  # is in .github/scripts/go-build-cache.sh.
  build-and-publish-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: create-tag
    permissions:
      contents: write   # attach the Windows archive to the draft
      actions: read     # find and download the previous release's build cache
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
      UPLOAD_URL: ${{ needs.create-tag.outputs.upload_url }}
      GO_CACHE_ARTIFACT: go-build-cache-windows
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: player/go.mod
          # Not setup-go's cache: that is actions/cache, which any workflow on
          # main can write, and what is restored here flows into the published
          # binary. The build cache comes from go-build-cache.sh instead.
          cache: false

      - name: Install MinGW-w64, SDL2, the Go modules and the build cache
        # The SDL tarballs, the Go modules and the previous build cache download
        # in the background while apt installs the compiler; none of them needs
        # another, and the step waits for all of them.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/fetch-logs"
          mkdir -p "$logs"
          : > "$logs/sdl.log"
          : > "$logs/go.log"
          show_logs() {
            echo "::group::SDL2 download"; cat "$logs/sdl.log"; echo "::endgroup::"
            echo "::group::Go toolchain, modules and build cache"; cat "$logs/go.log"; echo "::endgroup::"
          }
          # Whatever fails, apt included, the background logs still get shown.
          trap 'status=$?; [ "$status" -eq 0 ] || show_logs' EXIT
          echo "### Windows build" >> "$GITHUB_STEP_SUMMARY"

          # Versions, URLs and digests live in the shared script, so a bump is
          # one edit for this pipeline and the weekly Windows job alike.
          bash .github/scripts/install-sdl-mingw.sh "$RUNNER_TEMP/sdl2-src" > "$logs/sdl.log" 2>&1 &
          sdl_job=$!

          # Modules before the cache: the go command may first have to fetch the
          # toolchain go.mod names, and the restore asks it where the cache is.
          # go mod download, not go mod tidy: a release builds the module graph
          # that was committed, not a tidied copy of it. The restore is bounded:
          # a stalled download must cost a cold build, not the job's timeout and
          # with it the release.
          (
            cd player
            go version
            go mod download
            timeout 300 bash "$GITHUB_WORKSPACE/.github/scripts/go-build-cache.sh" restore "$GO_CACHE_ARTIFACT" ||
              echo "::warning title=Go build cache::the restore failed or ran out of time; building without it"
          ) > "$logs/go.log" 2>&1 &
          go_job=$!

          # Nothing here reads man pages: skip man-db's index rebuild. Only a
          # speed-up, so it must not be able to fail the release.
          sudo rm -f /var/lib/man-db/auto-update || true
          sudo apt-get update -q
          # Only the win32 flavour. The gcc-mingw-w64-x86-64 metapackage also
          # installs the posix one, but x86_64-w64-mingw32-gcc resolved to win32
          # (the higher-priority alternative) all along, so this is the same
          # compiler for half the download. Its binutils bring the objdump the
          # DLL check below uses.
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64-win32 zip
          x86_64-w64-mingw32-gcc --version | sed -n 1p

          if ! wait "$sdl_job"; then
            echo "::error::the SDL2 MinGW development packages did not download or verify (see the SDL2 download group)"
            exit 1
          fi
          if ! wait "$go_job"; then
            echo "::error::fetching the Go toolchain or the modules failed (see the Go group)"
            exit 1
          fi
          show_logs

      - name: Merge SDL2 into one MinGW prefix
        run: |
          # The prefix is named after what the cgo packages compile against that
          # Go's build cache cannot see. Go keys a cgo package on its compiler
          # flags and the compiler's version line, not on the headers the flags
          # point at, and that line ("13-win32") stays the same across Ubuntu's
          # MinGW revisions. A new SDL set or MinGW package therefore renames the
          # prefix, and the SDL bindings compile afresh instead of being reused.
          cgo_inputs=$({
            cat .github/scripts/install-sdl-mingw.sh
            dpkg-query -W -f '${Package} ${Version}\n' gcc-mingw-w64-x86-64-win32 mingw-w64-x86-64-dev binutils-mingw-w64-x86-64
          } | sha256sum | cut -c1-12)
          prefix="$RUNNER_TEMP/sdl2-$cgo_inputs"
          mkdir -p "$prefix"
          # Globbed so a version bump in the shared script needs no edit here.
          # The underscore is load-bearing: the tarballs extract as SDL2-<ver>,
          # SDL2_image-<ver> and SDL2_ttf-<ver>, so an "SDL2-*" pattern installs
          # only the base package. That once still reported success and the
          # release build then died on SDL_ttf.h and SDL_image.h.
          for dir in "$RUNNER_TEMP"/sdl2-src/SDL2*/x86_64-w64-mingw32; do
            echo "installing $dir"
            cp -r "$dir/"* "$prefix/"
          done
          # Fail here, naming the file, instead of at a cgo compile further down
          # with three "No such file" errors that do not say what fetched them.
          for need in include/SDL2/SDL.h include/SDL2/SDL_image.h include/SDL2/SDL_ttf.h \
                      lib/libSDL2.dll.a lib/libSDL2_image.dll.a lib/libSDL2_ttf.dll.a; do
            if [ ! -e "$prefix/$need" ]; then
              echo "::error::the SDL2 MinGW packages did not install $need"
              exit 1
            fi
          done
          echo "SDL2_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build Package
        # Exported in the script rather than set under env:, which does no shell
        # expansion: "$SDL2_PREFIX/include" there would reach cgo as literal text.
        run: |
          set -o pipefail
          export CC=x86_64-w64-mingw32-gcc
          export CGO_ENABLED=1 GOOS=windows GOARCH=amd64
          export CGO_CFLAGS="-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -D_REENTRANT"
          export CGO_LDFLAGS="-L$SDL2_PREFIX/lib"
          echo "CC: $CC"
          echo "CGO_CFLAGS: $CGO_CFLAGS"
          echo "CGO_LDFLAGS: $CGO_LDFLAGS"
          mkdir -p JukaHub-Trimui-Windows
          cd player
          # -v names each package actually compiled (not the cached ones), which
          # is how the cache step below tells a player-only release from one
          # that rebuilt dependencies. -s -w leave out the symbol table and DWARF,
          # as build.bat does: less for the linker to write and a smaller
          # download, while a panic still prints function names and lines.
          build() {
            go build -v -ldflags "-s -w -X main.buildDate=$(date -u +%Y-%m-%d)" \
              -o ../JukaHub-Trimui-Windows/JukaHub.exe ./ 2>&1 | tee "$RUNNER_TEMP/go-build.log"
          }
          start=$SECONDS
          if ! build; then
            # A restored cache that cannot build (an entry gone bad, a C
            # dependency Go does not track) must not fail every release after
            # it: retry once from an empty cache, which also makes the cache step
            # upload a fresh one. discard refuses when nothing was restored, as a
            # cold retry would only repeat the failure.
            bash "$GITHUB_WORKSPACE/.github/scripts/go-build-cache.sh" discard
            echo "::warning title=Go build cache::the build failed on the restored cache; retrying from an empty one"
            build
          fi
          echo "Build completed in $((SECONDS - start)) s."
          echo "- go build: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Package Artifacts
        run: |
          cd player
          cp jukaconfig.json Inter-Regular.ttf background.jpg SDL2.dll SDL2_image.dll SDL2_ttf.dll ../JukaHub-Trimui-Windows/
          cd ..
          # Every DLL the exe imports must be part of Windows or ship next to
          # it. The SDL DLLs come from player/ above; a MinGW runtime DLL (only
          # imported if the toolchain linked one dynamically) is copied from
          # the toolchain; anything else fails the release here instead of as
          # "The code execution cannot proceed" on someone's PC.
          dump=$(x86_64-w64-mingw32-objdump -p JukaHub-Trimui-Windows/JukaHub.exe)
          imports=$(printf '%s\n' "$dump" | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p' | tr -d '\r' | sort -u)
          if [ -z "$imports" ]; then
            echo "::error::could not read the DLL imports of JukaHub.exe"
            exit 1
          fi
          missing=""
          for dll in $imports; do
            echo "JukaHub.exe imports $dll"
            case "$dll" in
              SDL2*.dll|lib*.dll) ;;
              *) continue ;;
            esac
            if [ -e "JukaHub-Trimui-Windows/$dll" ]; then
              continue
            fi
            src=$(x86_64-w64-mingw32-gcc -print-file-name="$dll")
            if [ -f "$src" ]; then
              echo "bundling $src"
              cp "$src" JukaHub-Trimui-Windows/
            else
              missing="$missing $dll"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::JukaHub.exe needs$missing, which the Windows archive would not carry"
            exit 1
          fi
          # Tools -> Security & trust opens SECURITY.md from next to the binary.
          if [ -f SECURITY.md ]; then
            cp SECURITY.md JukaHub-Trimui-Windows/
          fi
          # Release stamp: shown in the UI and used by the auto updater.
          printf '{\n  "tag": "%s",\n  "date": "%s"\n}\n' "$TAG_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > JukaHub-Trimui-Windows/release-info.json
          zip -r JukaHub-Windows.zip JukaHub-Trimui-Windows/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-Windows.zip
          asset_name: JukaHub-Windows.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only for a push to main (restore accepts a cache from no other event),
      # after the release asset is attached, and bounded twice over: the cache
      # only speeds up the next release, so it must neither fail nor stall this
      # one.
      - name: Pack the build cache for the next release
        id: cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          own=$(cd player && go list -m)
          bash .github/scripts/go-build-cache.sh save "$GO_CACHE_ARTIFACT" "$RUNNER_TEMP/go-build-cache" "$RUNNER_TEMP/go-build.log" "$own"

      - name: Upload the build cache
        if: steps.cache.outputs.upload == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.GO_CACHE_ARTIFACT }}
          path: ${{ steps.cache.outputs.archive }}
          # Already zstd-compressed: zipping it again would only cost time.
          compression-level: 0
          retention-days: 90
          # A re-run of this job replaces its own earlier upload.
          overwrite: true
          if-no-files-found: error

  # Publishing is the last step, not the first: the draft from create-tag only
  # becomes visible after both build jobs succeeded and both archives are
  # attached. A failed or half-uploaded build therefore never becomes the
  # "latest" release, which is what produced the 404 on a download link during
  # an update that was still building.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [create-tag, build-and-publish-ubuntu, build-and-publish-windows]
    permissions:
      contents: write   # flip the verified draft to published
    # A pull-request build must not become a release: it was published before
    # too, which is how a branch build could take over /releases/latest.
    # The three results are spelled out instead of left to the implicit
    # success(), which looks at every job upstream, the Remote Play helpers
    # included: their failure must cost a release its helpers, never the
    # release itself.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      needs.create-tag.result == 'success' &&
      needs.build-and-publish-ubuntu.result == 'success' &&
      needs.build-and-publish-windows.result == 'success' }}
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
    steps:
      - name: Verify assets and publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const wanted = ['JukaHub-Trimui.zip', 'JukaHub-Windows.zip'];
            const {data: releases} = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              throw new Error(`no release found for ${tag}`);
            }
            const names = release.assets.map((a) => a.name);
            const missing = wanted.filter((name) => !names.includes(name));
            if (missing.length) {
              throw new Error(`${tag} is missing ${missing.join(', ')}; keeping the release as a draft`);
            }
            // The timestamped release workflow previously published an empty
            // body. Generate notes only after the assets are verified, so
            // published releases always have a useful changelog.
            const previous = releases
              .filter((r) => !r.draft && r.tag_name.startsWith('JukaHub-') && r.tag_name < tag)
              .sort((a, b) => b.tag_name.localeCompare(a.tag_name))[0];
            const {data: generated} = await github.request(
              'POST /repos/{owner}/{repo}/releases/generate-notes',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                ...(previous ? {previous_tag_name: previous.tag_name} : {}),
              }
            );
            if (!generated.body || !generated.body.trim()) {
              throw new Error(`${tag} has no generated notes; keeping the release as a draft`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: generated.body,
              draft: false,
            });
            core.info(`published ${tag} with ${names.join(', ')}`);
        
