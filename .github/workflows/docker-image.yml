name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag and Draft Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.generate_tag.outputs.tag_name }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Generate Tag Name
        id: generate_tag
        run: |
          timestamp=$(date +%Y%m%d%H%M%S)
          tag=JukaHub-$timestamp
          echo "tag_name=$tag" >> $GITHUB_OUTPUT

      - name: Set Tag using GitHub Script
        id: set_tag
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${{ steps.generate_tag.outputs.tag_name }}`,
              sha: context.sha,
            })

      # The release starts as a draft on purpose. GitHub publishes a release
      # the moment it is created, and the two builds below take many minutes,
      # so a published release showed only "Source code (zip)" while every
      # download link (README, website, in-app updater) pointed at an archive
      # that did not exist yet and answered 404. A draft keeps the tag and the
      # upload target, stays out of /releases/latest, and only becomes public
      # once publish-release has verified both archives are attached.
      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          release_name: ${{ steps.generate_tag.outputs.tag_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-ubuntu:
    runs-on: ubuntu-latest
    needs: create-tag
    container:
      # Pinned by digest: the image has one tag (latest), last pushed long ago, and a
      # silent re-push would change every build. Dependabot does not bump this.
      image: anibaldeboni/trimui-smart-pro-toolchain:latest@sha256:69c8c0cd1a0330f21d3e6d82885e67d01bd895dc007ec5d121bca8d857997c42
    env: 
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
      UPLOAD_URL: ${{ needs.create-tag.outputs.upload_url }}
    steps:
      - name: Debug TAG_NAME
        run: |
          echo "Debug TAG_NAME: ${TAG_NAME}"
      - name: Check Tag Name Variable
        run: |
          if [ -z "${TAG_NAME}" ]; then
            echo "TAG_NAME variable does not exist. Exiting."
            exit 1
          else
            echo "TAG_NAME variable exists: ${TAG_NAME}"
          fi
    
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Download and Install ARM Libraries
        run: |
          mkdir -p ${SYSROOT}/usr/lib
          mkdir -p ${SYSROOT}/usr/include

          # Download and install zlib 1.3.1
          wget https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar -xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          ./configure --prefix=${SYSROOT}/usr
          make
          make install
          cd ..

          # Download and install libpng 1.6.37
          wget https://download.sourceforge.net/libpng/libpng-1.6.37.tar.gz
          tar -xzf libpng-1.6.37.tar.gz
          cd libpng-1.6.37
          ./configure --host=aarch64-linux-gnu --prefix=${SYSROOT}/usr
          make
          make install
          cd ..

          # Download and install libjpeg
          wget http://www.ijg.org/files/jpegsrc.v9d.tar.gz
          tar -xzf jpegsrc.v9d.tar.gz
          cd jpeg-9d
          ./configure --host=aarch64-linux-gnu --prefix=${SYSROOT}/usr
          make
          make install
          cd ..

          # Download and install libbz2
          wget https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar -xzf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          make CC="aarch64-linux-gnu-gcc" AR="aarch64-linux-gnu-ar" RANLIB="aarch64-linux-gnu-ranlib" libbz2.a
          cp libbz2.a ${SYSROOT}/usr/lib/
          cp bzlib.h ${SYSROOT}/usr/include/
          cd ..

          # Download and install libtiff
          wget http://download.osgeo.org/libtiff/tiff-4.0.9.tar.gz
          tar -xzf tiff-4.0.9.tar.gz
          cd tiff-4.0.9
          if [ -f config/config.sub ]; then sed -i 's/| x86_64)/| x86_64| aarch64)/' config/config.sub; fi
          ./configure --host=aarch64-linux-gnu --prefix=${SYSROOT}/usr
          make
          make install
          cd ..

          # Download and install libwebp
          wget https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.0.0.tar.gz
          tar -xzf libwebp-1.0.0.tar.gz
          cd libwebp-1.0.0
          if [ -f config/config.sub ]; then sed -i 's/| x86_64)/| x86_64| aarch64)/' config/config.sub; fi
          ./configure --host=aarch64-linux-gnu --prefix=${SYSROOT}/usr
          make
          make install
          cd ..

          export SYSROOT=/usr/local/aarch64-linux-gnu-7.5.0-linaro/sysroot
          export CC="aarch64-linux-gnu-gcc --sysroot=${SYSROOT}"
          export CXX="aarch64-linux-gnu-g++ --sysroot=${SYSROOT}"
          export CGO_ENABLED=1
          export GOARCH=arm64
          export GOOS=linux
          export CGO_CFLAGS="-I${SYSROOT}/usr/include -I/usr/aarch64-linux-gnu/include -I/usr/aarch64-linux-gnu/include/SDL2 -I/usr/include/SDL2 -D_REENTRANT"
          export CGO_LDFLAGS="-L${SYSROOT}/usr/lib -L/usr/lib/aarch64-linux-gnu -lSDL2_image -lSDL2_ttf -lSDL2 -lpng -ltiff -lwebp -lfreetype -ljpeg -lz -lbz2 -ldl -lpthread -lm"
          ln -s ${SYSROOT}/lib/libpthread.so.0 /usr/lib/libpthread.so.0
          ln -s ${SYSROOT}/usr/lib/libpthread_nonshared.a /usr/lib/libpthread_nonshared.a

      - name: Install Dependencies
        run: |
          cd player
          GOPROXY=https://proxy.golang.org,direct
          go mod tidy

      - name: Build Package
        run: |
          mkdir -p ../JukaHub-Trimui
          cd player
          echo "Building package..."
          CGO_ENABLED=1 \
          CC="aarch64-linux-gnu-gcc --sysroot=${SYSROOT}" \
          CXX="aarch64-linux-gnu-g++ --sysroot=${SYSROOT}" \
          GOARCH=arm64 \
          GOOS=linux \
          CGO_CFLAGS="-I${SYSROOT}/usr/include -I/usr/aarch64-linux-gnu/include -I/usr/aarch64-linux-gnu/include/SDL2 -I/usr/include/SDL2 -D_REENTRANT" \
          CGO_LDFLAGS="-L${SYSROOT}/usr/lib -L/usr/lib/aarch64-linux-gnu -lSDL2_image -lSDL2_ttf -lSDL2 -ldl -lpthread -lm" \
          go build -tags dynamic -ldflags "-X main.buildDate=$(date -u +%Y-%m-%d)" -o ../JukaHub-Trimui/JukaHub ./
          echo "Build completed."

      - name: Package Artifacts
        run: |
          mkdir -p JukaHub-Trimui
          cp player/jukaconfig.json JukaHub-Trimui/
          cp player/Inter-Regular.ttf JukaHub-Trimui/
          cp player/launch.sh JukaHub-Trimui/
          cp player/config.json JukaHub-Trimui/
          cp player/background.jpg JukaHub-Trimui/
          cp player/JukaPlayer.png JukaHub-Trimui/
          # Release stamp: the app shows this date and the auto updater uses it
          # to decide whether a newer release exists.
          printf '{\n  "tag": "%s",\n  "date": "%s"\n}\n' "$TAG_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > JukaHub-Trimui/release-info.json
          zip -r JukaHub-Trimui.zip JukaHub-Trimui/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-Trimui.zip
          asset_name: JukaHub-Trimui.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-windows:
    runs-on: macos-latest
    needs: create-tag
    env: 
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
      UPLOAD_URL: ${{ needs.create-tag.outputs.upload_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install MinGW
        run: brew install mingw-w64

      - name: Set up MinGW directories
        run: |
          MINGW_DIR=$(brew --prefix mingw-w64)/toolchain-x86_64
          mkdir -p $MINGW_DIR/x86_64-w64-mingw32/bin
          mkdir -p $MINGW_DIR/x86_64-w64-mingw32/include
          mkdir -p $MINGW_DIR/x86_64-w64-mingw32/lib

      - name: Download and Install SDL2
        run: |
          # Download SDL2 development libraries
          curl -LO https://www.libsdl.org/release/SDL2-devel-2.30.11-mingw.tar.gz
          tar -xzf SDL2-devel-2.30.11-mingw.tar.gz
          MINGW_DIR=$(brew --prefix mingw-w64)/toolchain-x86_64
          sudo cp -r SDL2-2.30.11/x86_64-w64-mingw32/* $MINGW_DIR/x86_64-w64-mingw32/

      - name: Download and Install SDL2_image
        run: |
          # Download SDL2_image development libraries
          curl -LO https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.4/SDL2_image-devel-2.8.4-mingw.tar.gz
          tar -xzf SDL2_image-devel-2.8.4-mingw.tar.gz
          MINGW_DIR=$(brew --prefix mingw-w64)/toolchain-x86_64
          sudo cp -r SDL2_image-2.8.4/x86_64-w64-mingw32/* $MINGW_DIR/x86_64-w64-mingw32/

      - name: Download and Install SDL2_ttf
        run: |
          # Download SDL2_ttf development libraries
          curl -LO https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-mingw.tar.gz
          tar -xzf SDL2_ttf-devel-2.22.0-mingw.tar.gz
          MINGW_DIR=$(brew --prefix mingw-w64)/toolchain-x86_64
          sudo cp -r SDL2_ttf-2.22.0/x86_64-w64-mingw32/* $MINGW_DIR/x86_64-w64-mingw32/

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod

      - name: Install Dependencies
        run: |
          cd player
          go mod tidy

      - name: Verify Go Environment
        run: go env

      - name: Verify Compiler
        run: |
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version

      - name: Build Package
        env:
          CC: "x86_64-w64-mingw32-gcc"
          CXX: "x86_64-w64-mingw32-g++"
          CGO_ENABLED: 1
          GOARCH: "amd64"
          GOOS: "windows"
          MINGW_DIR: $(brew --prefix mingw-w64)/toolchain-x86_64
          CGO_CFLAGS: "-I$(brew --prefix mingw-w64)/toolchain-x86_64/x86_64-w64-mingw32/include -D_REENTRANT"
          CGO_LDFLAGS: "-L$(brew --prefix mingw-w64)/toolchain-x86_64/x86_64-w64-mingw32/lib -lSDL2 -lSDL2_image -lSDL2_ttf"
        run: |
          mkdir -p ../JukaHub-Trimui-Windows
          cd player
          echo "CC: $CC"
          echo "CXX: $CXX"
          echo "CGO_CFLAGS: $CGO_CFLAGS"
          echo "CGO_LDFLAGS: $CGO_LDFLAGS"
          go build -ldflags "-X main.buildDate=$(date -u +%Y-%m-%d)" -o ../JukaHub-Trimui-Windows/JukaHub.exe ./
          echo "Build completed."

      - name: Package Artifacts
        run: |
          cd player
          cp jukaconfig.json Inter-Regular.ttf background.jpg SDL2.dll SDL2_image.dll SDL2_ttf.dll ../JukaHub-Trimui-Windows/
          cd ..
          # Release stamp: shown in the UI and used by the auto updater.
          printf '{\n  "tag": "%s",\n  "date": "%s"\n}\n' "$TAG_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > JukaHub-Trimui-Windows/release-info.json
          zip -r JukaHub-Windows.zip JukaHub-Trimui-Windows/

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create-tag.outputs.upload_url }}
          asset_path: ./JukaHub-Windows.zip
          asset_name: JukaHub-Windows.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is the last step, not the first: the draft from create-tag only
  # becomes visible after both build jobs succeeded and both archives are
  # attached. A failed or half-uploaded build therefore never becomes the
  # "latest" release, which is what produced the 404 on a download link during
  # an update that was still building.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-tag, build-and-publish-ubuntu, build-and-publish-windows]
    # A pull-request build must not become a release: it was published before
    # too, which is how a branch build could take over /releases/latest.
    if: github.event_name != 'pull_request'
    env:
      TAG_NAME: ${{ needs.create-tag.outputs.tag_name }}
    steps:
      - name: Verify assets and publish
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const wanted = ['JukaHub-Trimui.zip', 'JukaHub-Windows.zip'];
            const {data: releases} = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              throw new Error(`no release found for ${tag}`);
            }
            const names = release.assets.map((a) => a.name);
            const missing = wanted.filter((name) => !names.includes(name));
            if (missing.length) {
              throw new Error(`${tag} is missing ${missing.join(', ')}; keeping the release as a draft`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
            });
            core.info(`published ${tag} with ${names.join(', ')}`);
        
