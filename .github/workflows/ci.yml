name: CI

# Runs on every push and pull request: syntax-check the builder scripts and run
# the jsdom/Playwright web tests, then vet and test the player on Linux with SDL2
# installed so the offscreen render tests can run headless.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web builder checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check builder scripts
        run: |
          for f in script.js builder-device.js builder-gallery.js gallery/layouts.js; do
            node --check "$f"
          done
      - name: Browser-free smoke and security tests (jsdom)
        working-directory: tests/web
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Lint builder scripts (undefined names, duplicate keys, unreachable code)
        run: >
          tests/web/node_modules/.bin/eslint -c tests/web/eslint.config.mjs
          script.js builder-device.js builder-gallery.js gallery/layouts.js
      - name: Audit test dependencies
        working-directory: tests/web
        # Advisory, like staticcheck: an advisory in jsdom's own tree should be
        # visible on every run but must not block a release of the player. The
        # builder ships no npm dependencies at runtime (it is plain ES modules
        # plus CDN fonts), so this covers the test harness, not shipping code.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Config files are valid JSON
        run: |
          for f in player/jukaconfig.json; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
          true

  web-e2e:
    name: Web builder smoke test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the builder smoke test
        # Loads the real page, drops a palette component on the canvas, checks
        # undo/redo, then exports JSON and re-imports it.
        run: npx playwright test
      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  govulncheck:
    name: Go vulnerability scan
    # Pinned for the same reason as the player jobs: the SDL2 dev packages
    # differ between Ubuntu releases. The scan builds the package to find the
    # calls that can reach a known vulnerability, so it needs the headers too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan the player
        # Advisory for now, like staticcheck. The scan includes the standard
        # library of whichever toolchain go.mod selects, so a fresh Go patch
        # release (or an unfixed one) can turn this red without any change in
        # this repository; the fix for that is a toolchain bump, not a code
        # change. Unreachable findings are printed but never fail either way.
        # Promote to blocking once the pinned toolchain is one release behind
        # the current patch line.
        continue-on-error: true
        run: govulncheck ./...

  player-core:
    name: Player helpers (no SDL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These packages do not import SDL, so they build and test with cgo off and
    # are the blocking half of the player checks.
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./internal/... ./web/... ./tools/...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/... ./web/... ./tools/... -count=1

  player:
    name: Player vet and tests
    # Pinned: the SDL2 dev packages differ between Ubuntu releases and the
    # ubuntu-latest label is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: go vet
        run: go vet ./...
      - name: go test
        # SDL_VIDEODRIVER=dummy lets the offscreen render tests run headless.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          go test ./... -count=1 -timeout 10m -covermode=atomic -coverprofile="$RUNNER_TEMP/cover.out" 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Put the failures where a reviewer looks: the step summary and
            # annotations on the run, not 25 s of scrollback.
            {
              echo "### go test failed"
              echo '```'
              grep -E '^\s*(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/gotest.log" | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            excerpt=$(grep -E -A2 '^\s*--- FAIL|^panic:|^FAIL' "$RUNNER_TEMP/gotest.log" | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test failed::${excerpt}"
            grep -E '^\s*--- FAIL' "$RUNNER_TEMP/gotest.log" | head -9 | while IFS= read -r line; do
              echo "::error title=Failing test::${line}"
            done
          fi
          exit "$status"

      - name: Coverage summary
        # Advisory: the profile exists even on failure as long as the test
        # binary got far enough, and the numbers sit in the step summary, so a
        # drop is visible without a third-party service reading the repo.
        if: always()
        run: |
          set +e
          if [ ! -f "$RUNNER_TEMP/cover.out" ] || [ ! -s "$RUNNER_TEMP/cover.out" ]; then
            echo "No coverage profile produced by the test run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          go tool cover -func="$RUNNER_TEMP/cover.out" > "$RUNNER_TEMP/cover-func.txt"
          total=$(grep -E '^total:' "$RUNNER_TEMP/cover-func.txt" | awk '{print $3}')
          missed=$(awk '$NF == "0.0%" && $1 != "total:" {n++} END {print n+0}' "$RUNNER_TEMP/cover-func.txt")
          { echo "### Go coverage"
            echo ""
            echo "Total: **${total:-n/a}** — ${missed} functions with 0% coverage."
            echo ""
            echo "<details><summary>Functions with 0% coverage (first 25)</summary>"
            echo ""
            echo '```'
            awk '$NF == "0.0%" && $1 != "total:" {print}' "$RUNNER_TEMP/cover-func.txt" | head -25
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  player-boot:
    name: Player cold-boot budget
    # Pinned: the SDL2 dev packages differ between Ubuntu releases and the
    # ubuntu-latest label is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Blocking on purpose: a regression that makes the app slower than five
    # seconds to first frame should not reach main, even while the full player
    # suite is still advisory. The desktop runner limit is deliberately looser
    # than the 2 s device target measured by running the same script on a
    # TrimUI; see docs/DEVELOPMENT.md.
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Cold-boot median
        env:
          JUKAHUB_BENCH_LIMIT_MS: "5000"
          JUKAHUB_BENCH_RUNS: "3"
        run: bash ./startup-bench.sh

  player-staticcheck:
    name: Player staticcheck
    # Pinned: the SDL2 dev packages differ between Ubuntu releases and the
    # ubuntu-latest label is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The backlog is triaged in player/staticcheck.conf (unused scene helpers,
    # player-facing error wording, and the deliberate CFB/math-rand deprecations
    # are off); every other check fails the run, so the output stays readable.
    # Blocking: it has been green on main since the S1016 fix. Releases are a
    # separate workflow, so a finding turns CI red without stopping a build.
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" ./...

  player-race:
    name: Player race detector
    # Pinned: the SDL2 dev packages differ between Ubuntu releases and the
    # ubuntu-latest label is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: go test -race
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          go test -race ./... -count=1 -timeout 20m 2>&1 | tee "$RUNNER_TEMP/race.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the cause as annotations: the raw log is hard to reach.
            excerpt=$(grep -E -A3 'WARNING: DATA RACE|^\s*--- FAIL|^panic:|^FAIL' "$RUNNER_TEMP/race.log" | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test -race failed::${excerpt}"
            { echo "### go test -race failed"; echo '```'; grep -E 'WARNING: DATA RACE|--- FAIL|^FAIL|panic:' "$RUNNER_TEMP/race.log" | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
