name: CI

# Runs on every push and pull request. The player has ~150 test files but no
# workflow ran them; the existing workflows only build packages.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web builder checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check builder scripts
        run: |
          for f in script.js builder-device.js builder-gallery.js gallery/layouts.js; do
            node --check "$f"
          done
      - name: Browser-free smoke and security tests (jsdom)
        working-directory: tests/web
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Config files are valid JSON
        run: |
          for f in player/jukaconfig.json; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
          true

  player:
    name: Player vet and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Not blocking yet: this job has not run on a GitHub runner. Once it is
    # green on main, delete the next line so failures block merges.
    continue-on-error: true
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum
      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: go vet
        run: go vet ./...
      - name: go test
        # SDL_VIDEODRIVER=dummy lets the offscreen render tests run headless.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          go test ./... -count=1 -timeout 10m 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # A failed step in a non-blocking job still shows a green run, so
            # surface the failures where a reviewer will actually look.
            {
              echo "### go test failed"
              echo '```'
              grep -E '^\s*(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/gotest.log" | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            excerpt=$(grep -E -A2 '^\s*--- FAIL|^panic:|^FAIL' "$RUNNER_TEMP/gotest.log" | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test failed::${excerpt}"
            grep -E '^\s*--- FAIL' "$RUNNER_TEMP/gotest.log" | head -9 | while IFS= read -r line; do
              echo "::error title=Failing test::${line}"
            done
          fi
          exit "$status"
