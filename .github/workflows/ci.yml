name: CI

# Keep the per-push check short. The release workflow compiles the player on
# main, and weekly.yml runs the larger test suites. Builder syntax and workflow
# pins are checked here because neither is covered by the player build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow pins
        run: bash .github/scripts/check-workflows.sh
      - name: Check builder syntax and config
        run: |
          for f in builder-icons.js script.js builder-device.js builder-gallery.js gallery/layouts.js; do
            node --check "$f"
          done
          node -e "JSON.parse(require('fs').readFileSync('player/jukaconfig.json','utf8'))"
