name: Build SD card package

# Build the TrimUI Smart Pro (linux/arm64, CGO + SDL2) SD-card package.
#
# The job runs inside the community TrimUI Smart Pro toolchain image, which
# already contains: the Allwinner A133P SDK sysroot, the linaro aarch64 gcc,
# SDL2 2.26.1 (built for the GE8300 GPU) and Go.
#
# Run it:  Actions -> Build SD card package -> Run workflow
# Result:  artifact "JukaHub-SDCARD" containing JukaHub-SDCARD.zip
#
# By hand only. On every push it built the handheld binary a second time and,
# worse, the Remote Play helpers a second time (about a quarter of an hour of
# arm64 runner), beside the release pipeline in docker-image.yml, which
# publishes the same binary and helpers in JukaHub-Trimui.zip anyway. A run
# from here finds no helpers to reuse (only push-to-main runs of the same
# workflow leave any), so it always builds them.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdcard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PS Remote Play helpers for Apps/JukaHub/bin and AndroidRT for
  # Apps/JukaHub/androidrt; see remote-play-helpers.yml. (Its Box64 pack is a
  # release asset JukaHub installs by itself, so the card does not carry it.)
  helpers:
    name: Remote Play helpers and runtimes
    uses: ./.github/workflows/remote-play-helpers.yml
    # What the helpers job asks for (actions read finds helpers an earlier run
    # built); a called workflow asking for more than this grants cannot start.
    permissions:
      contents: read
      actions: read

  sdcard:
    name: linux/arm64 + SD card layout
    needs: helpers
    # Packages whatever became of the helpers: without them the SD card package
    # still builds and only lacks Remote Play streaming.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Pinned by digest: the image has one tag (latest), last pushed long ago, and a
      # silent re-push would change every build. Dependabot does not bump this.
      image: anibaldeboni/trimui-smart-pro-toolchain:latest@sha256:69c8c0cd1a0330f21d3e6d82885e67d01bd895dc007ec5d121bca8d857997c42
    env:
      # Go's caches at paths the cache step below can name for certain. A
      # container job's HOME is /github/home, not the image's, so unless the
      # image sets them Go's default caches are not the /home/toolchain folders
      # this step used to save, and a run compiled everything from nothing.
      GOCACHE: /github/home/.cache/go-build
      GOMODCACHE: /github/home/go/pkg/mod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actions/cache is fine here and not in the release: this artifact is a
      # CI download, not what devices install (docker-image.yml's TrimUI build
      # carries its cache with go-build-cache.sh instead). The workflow file is
      # in the key because it pins the image, whose headers cgo compiles
      # against and Go's cache keys cannot see; go.mod for its toolchain line
      # and package-sdcard.sh for the build flags, because an exact key match
      # is never saved again and would otherwise pin a stale cache.
      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /github/home/go/pkg/mod
            /github/home/.cache/go-build
          key: tspsdcard-${{ hashFiles('.github/workflows/build-sdcard.yml') }}-${{ hashFiles('player/go.mod', 'player/go.sum', 'player/package-sdcard.sh') }}
          restore-keys: |
            tspsdcard-${{ hashFiles('.github/workflows/build-sdcard.yml') }}-

      - name: Download the Remote Play helpers
        # Into native/bin, where package-sdcard.sh looks for them. Absent when
        # their build failed. Bounded, because continue-on-error does not end a
        # step that hangs.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: remote-play-helpers
          path: player/native/bin

      - name: Download AndroidRT
        # JukaHub-AndroidRT-linux-arm64.zip into native/bin, which
        # package-sdcard.sh checks and unpacks into Apps/JukaHub/androidrt.
        # Absent when its build failed; the card then goes without it.
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: androidrt-package
          path: player/native/bin

      - name: Build and package
        working-directory: player
        env:
          # Keep the package small on the CI run: the device can also fetch
          # ffmpeg/yt-dlp on its own from MISC -> Tools.
          WITH_FFMPEG: "1"
          WITH_YTDLP: "1"
        run: |
          chmod +x package-sdcard.sh
          ./package-sdcard.sh

      - name: Upload SD card package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JukaHub-SDCARD
          if-no-files-found: error
          path: |
            player/dist/JukaHub-SDCARD.zip
            player/dist/JukaHub-SDCARD/

      - name: Summary
        run: |
          {
            echo "### SD card package"
            echo ""
            echo '```'
            cat player/dist/build-summary.txt 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"