name: CodeQL

# Static security analysis for Go. Runs weekly and on the default branch, so a
# new finding surfaces outside a pull request and does not slow per-commit CI.
# The Go extractor does not support build-mode: none, and the player is a cgo
# program (SDL2 bindings), so the build is manual: install the SDL dev packages,
# then compile the player once while CodeQL watches.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (go)
    # Pinned: the SDL2 dev packages differ between Ubuntu releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum

      - name: Install SDL2 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build the player
        working-directory: player
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
