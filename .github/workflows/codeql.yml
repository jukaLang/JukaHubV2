name: CodeQL

# Static security analysis for Go. Runs weekly and on the default branch, so a
# new finding surfaces outside a pull request and does not slow per-commit CI.
# build-mode: none is deliberate: the player is a cgo program (SDL2 bindings),
# and CodeQL's Go extractor does not need a full build — a compile attempt here
# would have to install the SDL dev packages for no analysis gain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: player/go.mod
          cache-dependency-path: player/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
