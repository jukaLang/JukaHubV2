# Weekly CodeQL for the Go player and the builder's JavaScript. Deliberately
# not a per-push job: the slow checks live in weekly.yml and a new per-push job
# would slow every PR (MODERNIZATION.md SEC-10).
name: CodeQL

on:
  schedule:
    - cron: "20 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: player/go.mod
          cache: false
      - name: Initialize CodeQL
        # Same pinned release as scorecard.yml's upload-sarif. build-mode: none
        # keeps the analysis independent of SDL2 headers: CodeQL reads the Go
        # and JavaScript sources without compiling the cgo player.
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
