# Where to ask what
#
# The blank template stays available for everything that is not a bug or a
# feature request (build help, packaging, "is this possible on my device").
blank_issues_enabled: true
contact_links:
  - name: Documentation
    url: https://github.com/jukaLang/JukaHubV2/tree/main/docs
    about: Config reference, controls, packages, building, recovery, troubleshooting.
  - name: Report a vulnerability
    url: https://github.com/jukaLang/JukaHubV2/blob/main/SECURITY.md
    about: Security issues go here, privately, not in a public issue.
  - name: Latest release and known issues
    url: https://github.com/jukaLang/JukaHubV2/releases/latest
    about: Check whether the problem is already fixed in a newer build.
