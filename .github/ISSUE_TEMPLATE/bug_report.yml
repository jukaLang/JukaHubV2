name: Bug report
description: Something in JukaHub misbehaves on the handheld, in a desktop build or during an update.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check:

        * the [documentation](https://github.com/jukaLang/JukaHubV2/tree/main/docs)
          (controls, Wi-Fi, recovery, packages, compile errors and more),
        * the [latest release notes](https://github.com/jukaLang/JukaHubV2/releases/latest)
          — the problem may already be fixed,
        * the [existing issues](https://github.com/jukaLang/JukaHubV2/issues) for a
          duplicate.

        If this is a security problem, **do not** open a public issue; follow
        [SECURITY.md](https://github.com/jukaLang/JukaHubV2/blob/main/SECURITY.md).

  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Which machine shows the problem?
      options:
        - TrimUI Smart Pro
        - TrimUI Smart Pro S
        - TrimUI Brick
        - TrimUI Brick Pro
        - TrimUI Hammer
        - Desktop build (Windows / Linux / macOS)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware or stock image
      description: The stock OS version, or the custom image (CrossMix and friends) JukaHub runs on top of.
      placeholder: "e.g. stock TrimUI 1.0.4, CrossMix 1.3"

  - type: input
    id: version
    attributes:
      label: JukaHub version
      description: The version line from the About screen (or the home header), including the build date.
      placeholder: "e.g. v0.4.0 · 2026-10-17"
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - On the handheld
        - In a desktop build
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happens?
      description: What you expected, and what happened instead. Name the screen or panel you were on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that reliably shows the problem, starting from a cold launch when possible.
      placeholder: |
        1. Power on and open ...
        2. Press ...
        3. ...

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        **Tools → Community & support → Report a bug** fills in a redacted
        diagnostics block (version, device, platform, free storage, network and
        pending update — no paths, filenames or settings). Paste it here, or
        export it from the same screen and attach the file. If the app will not
        start, skip this and attach `Apps/JukaHub/errors.txt` instead.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Attach `Apps/JukaHub/errors.txt` (the launcher log) or the file written
        by **Logs → Export** (`Apps/JukaHub/logs.txt`). Drag the file into this
        box to attach it.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the documentation and the latest release notes.
          required: true
        - label: I searched the existing issues for a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
