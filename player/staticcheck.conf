# staticcheck configuration for the player package.
#
# The advisory CI job runs `staticcheck ./...` with these settings. Only the
# triaged backlog recorded in docs/IMPROVEMENTS.md is disabled; everything else
# still fails the job, so a new real problem is caught instead of hidden in a
# wall of style noise.
#
#   U1000  unused code. Hundreds of helpers and vars are only reachable from
#          scene paths that are registered dynamically or kept for the web
#          builder, so staticcheck's reachability analysis reports them dead.
#          Removing them is a per-feature cleanup, not a lint gate.
#   ST1*   style checks (naming, comment form, error phrasing). ST1005 alone
#          fires on strings shown verbatim in toasts and dialogs ("Ghost is
#          offline"), which are written for the player, not for Go style.
#          ST1003/ST1020-22 are legacy naming and doc-comment form.
#   SA1019 deprecated APIs. Two uses are deliberate: CFB for the PS4
#          remote-play protocol (the format mandates it) and math/rand for
#          deterministic gameplay sequences.
checks = ["all", "-U1000", "-ST1*", "-SA1019"]
